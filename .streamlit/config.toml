[client]
# Hide Python tracebacks from users — show friendly error banners only
showErrorDetails = false
toolbarMode = "minimal"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
# Don't open browser tab automatically
serverAddress = "localhost"
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f4f6fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"
